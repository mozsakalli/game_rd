<!DOCTYPE html>
<!-- DigitoyEngine wasm kabugu: ilk build'de uretilir, sonra size aittir (aotcompiler dokunmaz).
     game.js/game.wasm/game.data her build yeniden yazilir. HTTP sunucudan acin (file:// wasm/fetch'e izin vermez). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{APP_NAME}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px; color: #ccc; font: 13px system-ui, sans-serif; background: rgba(0,0,0,.6); pointer-events: none; }
    #status.hidden { display: none; }
    #bar { height: 3px; background: #4ea1ff; width: 0; transition: width .15s; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status"><div id="bar"></div><div id="text">Loading…</div></div>
  <script>
    var statusEl = document.getElementById('status'), textEl = document.getElementById('text'), barEl = document.getElementById('bar');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      setStatus: function (t) {
        // emscripten: "Downloading data... (x/y)" formati
        var m = t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) barEl.style.width = (100 * parseFloat(m[1]) / parseFloat(m[3])) + '%';
        textEl.textContent = t;
        if (!t) statusEl.classList.add('hidden');
      },
      onRuntimeInitialized: function () { statusEl.classList.add('hidden'); Module.canvas.focus(); },
      onAbort: function (what) { statusEl.classList.remove('hidden'); textEl.textContent = 'Error: ' + what; barEl.style.background = '#f55'; }
    };
    window.onerror = function (msg) { statusEl.classList.remove('hidden'); textEl.textContent = 'Error: ' + msg; };
  </script>
  <script async src="game.js"></script>
</body>
</html>
